<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Management System</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="login" class="login-page">
 <div class="login-card"><div class="logo">🚚</div><h1>FleetFlow</h1><p>Fleet Management Dashboard</p>
 <form id="loginForm"><input id="email" type="email" placeholder="Email" value="admin@fleet.com" required>
 <input id="password" type="password" placeholder="Password" value="Admin@123" required>
 <button>Sign In</button><div id="loginMsg"></div></form></div>
</div>
<div id="app" class="hidden">
 <aside><h2>🚚 FleetFlow</h2><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="vehicles">Vehicles</button><button class="nav" data-page="drivers">Drivers</button><button class="nav" data-page="assignments">Assignments</button><button class="nav" id="logout">Logout</button></aside>
 <main><header><div><h1 id="pageTitle">Dashboard</h1><small id="userInfo"></small></div></header>
 <section id="dashboard" class="page"><div class="cards">
  <div class="card"><span>Total Vehicles</span><b id="totalVehicles">0</b></div><div class="card"><span>Active Vehicles</span><b id="activeVehicles">0</b></div>
  <div class="card"><span>Total Drivers</span><b id="totalDrivers">0</b></div><div class="card"><span>Unassigned Drivers</span><b id="unassignedDrivers">0</b></div></div>
  <div class="panel"><h2>Fleet Status</h2><div id="statusSummary"></div></div></section>
 <section id="vehicles" class="page hidden"><div class="toolbar"><button class="primary manager-only" onclick="openVehicle()">+ Add Vehicle</button><input id="vehicleSearch" placeholder="Search vehicles..." oninput="renderVehicles()"></div><div class="panel"><table><thead><tr><th>Plate</th><th>Model</th><th>Manufacturer</th><th>Capacity</th><th>Status</th><th>Driver</th><th>Actions</th></tr></thead><tbody id="vehicleRows"></tbody></table></div></section>
 <section id="drivers" class="page hidden"><div class="toolbar"><button class="primary manager-only" onclick="openDriver()">+ Add Driver</button><input id="driverSearch" placeholder="Search drivers..." oninput="renderDrivers()"></div><div class="panel"><table><thead><tr><th>Name</th><th>Phone</th><th>License</th><th>Expiry</th><th>Status</th><th>Vehicle</th><th>Actions</th></tr></thead><tbody id="driverRows"></tbody></table></div></section>
 <section id="assignments" class="page hidden"><div class="toolbar"><button class="primary manager-only" onclick="openAssignment()">+ Assign Driver</button></div><div class="panel"><table><thead><tr><th>Vehicle</th><th>Driver</th><th>Assigned At</th><th>Action</th></tr></thead><tbody id="assignmentRows"></tbody></table></div></section>
 </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><form id="modalForm"></form></div></div>
<script src="js/app.js"></script></body></html>
